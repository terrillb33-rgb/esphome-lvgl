# lvgl.yaml — SmartRoom Dashboard Layout
# --------------------------------------

lvgl:
  pages:
    - id: main_page
      widgets:

        # 🏠 Header
        - label:
            text: "SmartRoom Control"
            align: center
            text_font: $title_font
            width: $screen_width
            height: $button_height_single

        # 💡 Lighting Control- container:
              - container:
                  layout: flex
                  flex_flow: row
                  align: center
                  spacing: 10
                  widgets:
                    
          ...

              # Front Left Strip
              - button:
                  height: $button_height_single
                  width: $button_width
                  checkable: true
                  id: front_left_button
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: top_left
                        text: $light
                    - label:
                        align: bottom_left
                        text: "Front Left"
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.front_left_strip

              # Front Right Strip
              - button:
                  height: $button_height_single
                  width: $button_width
                  checkable: true
                  id: front_right_button
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: top_left
                        text: $light
                    - label:
                        align: bottom_left
                        text: "Front Right"
                  on_click:
                    - homeassistant.service:
                        service: light.toggle
                        data:
                          entity_id: light.front_right_strip

        # 🎬 Projector Screen
        - button:
            height: $button_height_single
            width: $button_width_double
            checkable: false
            id: projector_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $screen
              - label:
                  align: bottom_left
                  text: "Projector Screen"
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.projector_screen

        # 🔊 Audio System
        - button:
            height: $button_height_single
            width: $button_width_double
            checkable: false
            id: audio_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $speaker
              - label:
                  align: bottom_left
                  text: "Audio System"
            on_click:
              - homeassistant.service:
                  service: media_player.toggle
                  data:
                    entity_id: media_player.smartroom_audio

        
